name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke test — imports
        run: |
          python -c "
          from crawlerai import crawl_llm, crawl_schema, generate_schema, export_to_csv
          from crawlerai.__version__ import __version__
          print('✅ All imports OK — crawlerai', __version__)
          "

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
        # Skip if tests/ doesn't exist yet
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter
        run: pip install ruff
      - name: Lint
        run: ruff check crawlerai/

name: Docker Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'docker-rebuild-v*'   # Manual Docker rebuild: git tag docker-rebuild-v0.1.0 && git push --tags

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=${GITHUB_REF#refs/tags/docker-rebuild-v}
          fi
          VERSION=${VERSION#v}   # strip leading 'v'
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Docker image for version: $VERSION"

      - name: Extract semantic version components
        id: semver
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f1-2)
          echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
          echo "MINOR=$MINOR" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            crawlerai/crawlerai:${{ steps.get_version.outputs.VERSION }}
            crawlerai/crawlerai:${{ steps.semver.outputs.MINOR }}
            crawlerai/crawlerai:${{ steps.semver.outputs.MAJOR }}
            crawlerai/crawlerai:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            CRAWLERAI_VERSION=${{ steps.get_version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## 🐳 Docker Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Tags" >> $GITHUB_STEP_SUMMARY
          echo "- \`crawlerai/crawlerai:${{ steps.get_version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`crawlerai/crawlerai:${{ steps.semver.outputs.MINOR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`crawlerai/crawlerai:${{ steps.semver.outputs.MAJOR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`crawlerai/crawlerai:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64 (x86)" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64 (Apple Silicon / AWS Graviton)" >> $GITHUB_STEP_SUMMARY

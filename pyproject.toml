[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlerai"
version = "0.1.0"
description = "Lightweight web crawling library — LLM extraction and CSS schema extraction"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["web-scraping", "crawler", "llm", "css-selectors", "playwright"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "crawl4ai>=0.8.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "playwright-stealth>=1.0",
]

[project.optional-dependencies]
cli = ["click>=8.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# Requires: pip install "crawlerai[cli]"
crawlerai = "crawlerai.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlerai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
